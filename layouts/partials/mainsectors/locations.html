{{$imagedomain := string .Site.Params.imagedomain }}

<style>

  .bgblack{
    background-color: #2D3137;
    padding:0;
  }
.parent {
display: grid;
grid-template-columns: repeat(5, 1fr);
grid-template-rows: repeat(2, 1fr);
grid-column-gap: 0px;
grid-row-gap: 0px;
}
.herotext{
    z-index:999;
  grid-column-start: 1;
  grid-column-end: 4;
  grid-row-start: 2;
  grid-row-end: 3;
  color: white;
  h1{
    color: white;
    font-size: 6rem;
    line-height: 7rem;
letter-spacing: 1.5rem;
  }
}
.heroimg{
  grid-column-start: 1;
  grid-column-end: 6;
  grid-row-start: 1;
  grid-row-end: 3;
  object-fit:contain;
  height:100%"
}
.downloads{
  padding-top: 5rem;
}

</style>

<section class="section_header-50-50 bgblack">
    <div class="container">
        <div class="parent">
            <div class="herotext ">
                <h1 class="">{{ .Params.hero.heading }}</h1>
                <div class="p-large">{{ .Params.hero.blurb }}</div>
            </div>
            <div class="heroimg">
                <div class="img-wrapper pl10">
                    <img src="{{ .Params.hero.heroImg }}" alt="Sector image">
                </div>
            </div>

        </div>
    </div>
</section>
<div class="container downloads">
<div class="row">
{{ range sort .Params.locations.items "Name" "asc" }}
  {{ if .display }}
        <div class="col-12 col-lg-4 card-wrapper">
          <a href="{{ .pdf }}" target="_blank">
            <div class="card shadow">
                <div class="card-header {{ .clr }}">
                    <img src="{{ .Thumbnail }}" alt="{{ .Name }}">
                </div>
                <div class="card-body justify-content-between">
                    <h2 class="m-0 text-green">{{ .Name }}</h2>
                    <h5 class="download">Download</h5>

                    <!--<div class="field-wrapper brochure-checkbox d-flex align-items-end"> 
                        
                    </div>-->
                </div>
            </div>
          </a>
        </div>
  {{ end }}
{{ end }}
</div>
</div>
